<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara360 KI-Chat</title>
    <link rel="stylesheet" href="/clara-ki/assets/clara_styles.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: #f5f5f5;
      }
      #clara-root {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .clara-chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="clara-root">
      <div class="clara-chat-container">
        <h1>Clara360 KI-Chat</h1>
        <div id="clara-chat-panel"></div>
      </div>
    </div>
    
    <!-- Clara Intelligence Engine -->
    <script src="/clara-ki/training_registry.json" type="application/json" id="training-data"></script>
    
    <!-- Clara360 Integration Scripts -->
    <script src="/system/clara_json_engine.js"></script>
    <script src="/system/clara_voice.js"></script>
    <script src="/lib/clara_dialog_context.js"></script>
    <script src="/system/clara_integration.js"></script>
    
    <script>
      // Clara KI Panel Initialisierung
      document.addEventListener('DOMContentLoaded', function() {
        console.group('[CLARA-FUSION] Initialisierung');
        console.log('🧠 Clara KI Panel wird initialisiert...');
        
        // Clara Integration starten
        if (window.ClaraKI && window.ClaraKI.Integration) {
          window.ClaraKI.Integration.init({
            enableVoice: false,  // Voice standardmäßig deaktiviert
            enableLogging: true,
            enableSuggestions: true
          });
          console.log('✅ Clara Integration gestartet');
        } else {
          console.error('❌ Clara Integration nicht gefunden');
        }
        
        console.groupEnd();
      });
    </script>
  </body>
</html>
