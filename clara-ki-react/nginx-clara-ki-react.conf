# Nginx configuration for Clara-KI React App
# Path: /etc/nginx/sites-available/clara-ki-react.conf

# Clara-KI React App location block
location /clara-ki-react {
    root /var/www/clara360;
    index index.html;
    try_files $uri $uri/ /clara-ki-react/index.html;
    
    # Cache control
    add_header Cache-Control "no-store";
    
    # CORS headers for API calls
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";
}

# Assets caching for better performance
location /clara-ki-react/assets/ {
    root /var/www/clara360;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# How to install:
# 1. Copy this file to /etc/nginx/sites-available/clara-ki-react.conf
# 2. Include it in your main nginx configuration:
#    include /etc/nginx/sites-available/clara-ki-react.conf;
# 3. Test nginx configuration: sudo nginx -t
# 4. Reload nginx: sudo systemctl reload nginx

